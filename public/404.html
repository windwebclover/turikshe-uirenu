<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <script>
    const path = window.location.pathname;
    const base = '/turikshe-uirenu';

    if (path.startsWith(base)) {
      const route = path.slice(base.length);

      window.location.replace(
        base + '/?redirect=' + encodeURIComponent(route)
      );
    }
  </script>
</head>
<body></body>
</html>
